[package]
name = "starlight-renderer"
version = "0.0.1"
edition = "2024"
license = "MIT-0/Apache-2.0"
description = "WIP renderer framework"

# this patch is needed for OpenXR support, its only used in the related examples and code that uses this crate
[patch.crates-io]
vulkano = { git = "https://github.com/Schmarni-Dev/vulkano", branch = "custom_new_closure_0_35" }

[dependencies]
ash = "0.38.0"
bytemuck = { version = "1.25.2", features = [] }
drm-fourcc = "2.2.0"
glam = { version = "0.33.2", features = ["bytemuck", "mint"] }
offset-allocator = "0.2.0"
rustix = { version = "1.1.4", features = ["fs"] }
timeline_syncobj = { version = "0.2.1", features = ["tokio"] }
tokio = { version = "1.52.3", features = ["rt", "sync", "rt-multi-thread"] }
tracing = "0.1.44"
vulkano = { version = "0.35.2", default-features = false, features = [
	"macros",
	"document_unchecked",
] }
vulkano-shaders = "0.35.0"

[dev-dependencies]
openxr = { version = "0.21.1", features = ["mint"] }
rand = "0.10.2"
tokio = { version = "1.52.3", features = ["full"] }
winit = { version = "0.30.13", default-features = false, features = [
	# "wayland",
	"mint",
	"rwh_06",
	"x11",
] }
mint = "0.5.9"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
